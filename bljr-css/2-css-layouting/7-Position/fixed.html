<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Absolute</title>
    <style>
        body {
            height: 2000px;
        }
        div {
            width: 150px;
            height: 150px;
            margin: auto;
        }
        .container {
            width: 600px;
            height: 600px;
            border: 10px solid black;
            position: relative;
            /* agar parent ikut naik 1 dimensi */
        }
        .satu {
            background-color: #CD7F32;
        }
        .dua {
            background-color: silver;
            height: 30px;
            width: 100%;
            position: fixed;
            /* position: static (default), relative, absolute, fixed */
            /* non-static can access property: top left bottom right */
            /* fixed (bergerak relatif thd windows browser) */
            top: 0;
            left: 0;
        }
        .tiga {
            background-color: gold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="satu"></div>
        <div class="dua"></div>
        <div class="tiga"></div>
    </div>
</body>
</html>
