<!DOCTYPE html>
<html lang="en">
<head>
    <title>Dimensi & Overflow</title>
    <style>
        div {
            width: 50%;
            height: 200px;
            /* properti dimensi: width (lebar), height (tinggi) */
            /* satuan width & height: px (absolut), % (relatif thd element parent), in, cm, mm, pt (ponit), pc (pica) */
            /* disarankan mengatur dimensi suatu elemen hanya lebarnya saja agar tinggi sesuai dgn isi konten */
            background-color: lightgreen;
        }
    </style>
</head>
<body>
    <div>Hello World</div>
</body>
</html>
