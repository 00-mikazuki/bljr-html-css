<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Grid | Auto Fill & Auto Fit</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #ddd;
    }

    .container {
      width: 60%;
      margin: 50px auto;
      border: 5px solid orange;
      display: grid;
      grid-template-columns: repeat(auto-fit, 150px);
      /* 
      auto-fill & auto-fit
      menentukan jumlah item untuk berada pada grid track, biasa digunakan pada nilai repeat
      auto-fill = mengisi tempat kosong, grid berakhir pada sisa ruang yang masih bisa ditempati items, menentukan akhir dari grid
      auto-fit = mengisi tempat kosong, grid secara explicit berakhir pada items terakhir, biasa digunakan jika ingin membuat 1 bagian kosong
      */
    }

    .item {
      background-color: rgb(138, 209, 254);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .item:nth-child(even) {
      background-color: rgb(255, 142, 142);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <!-- <div class="item">4</div>
    <div class="item">5</div>
    <div class="item">6</div>
    <div class="item">7</div>
    <div class="item">8</div>
    <div class="item">9</div> -->
  </div>
</body>
</html>
