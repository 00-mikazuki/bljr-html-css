<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Align Content</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    .container {
      width: 80%;
      height: 700px;
      margin: auto;
      display: grid;
      grid-template-columns: 120px 180px 120px;
      grid-template-rows: 80px 80px;
      gap: 5px;
      /* 
      align-content: start | end | center | stretch | space-around | space-between | space-evenly 
      Mengatur posisi seluruh grid container pada sumbu vertikal.
      Bisa dilakukan ketika ukuran total grid lebih kecil dari ukuran containernya, biasanya ketika grid itemsnya menggunakan ukuran fixed (px)
      */
  
      /* align-content: start; */
      /* seluruh grid akan berada di atas (awal) container */
  
      /* align-content: end; */
      /* seluruh grid akan berada di bawah (akhir) container */
      
      /* align-content: center; */
      /* seluruh grid akan berada di tengah container secara vertikal */
      
      /* align-content: stretch; */
      /* seluruh grid akan memenuhi container secara vertikal */
      
      /* align-content: space-around; */
      /* memberi jarak pada tiap baris (atas-bawah) mengelilingi baris tsb */
      
      /* align-content: space-between; */
      /* memberi jarak diantara tiap baris */
  
      /* align-content: space-evenly; */
      /* memberi jarak pada tiap baris dengan besar yg sama */
    }

    .items {
      width: 100px;
      height: 50px;
      border: 3px solid black;
      background-color: lightblue;
      justify-content: end;
    }

    </style>
</head>
<body>
  <div class="container">
    <!-- div.items.i$*9{$} -->
    <div class="items i1">1</div>
    <div class="items i2">2</div>
    <div class="items i3">3</div>
    <div class="items i4">4</div>
    <div class="items i5">5</div>
    <div class="items i6">6</div>
    <div class="items i7">7</div>
    <div class="items i8">8</div>
    <div class="items i9">9</div>
  </div>
</body>
</html>
