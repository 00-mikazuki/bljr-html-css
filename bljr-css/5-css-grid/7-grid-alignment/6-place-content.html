<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Place content</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    .container {
      width: 80%;
      height: 500px;
      margin: auto;
      display: grid;
      grid-template-columns: 120px 180px 120px;
      grid-template-rows: 80px 80px;
      gap: 5px;
      /* justify-content: center;
      align-content: center; */
      place-content: space-around space-between;
      /*
      place-content: <align-content> <justify-content>;
      place-content: center; (keduanya center)
      shorthand untuk menggunakan justify-content dan align-content secara bersamaan 
      */
    }

    .items {
      border: 3px solid black;
      width: 100px;
      height: 50px;
      background-color: lightblue;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- div.items.i$*9{$} -->
    <div class="items i1">1</div>
    <div class="items i2">2</div>
    <div class="items i3">3</div>
    <div class="items i4">4</div>
    <div class="items i5">5</div>
    <div class="items i6">6</div>
    <div class="items i7">7</div>
    <div class="items i8">8</div>
    <div class="items i9">9</div>
  </div>
</body>
</html>
