<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float</title>
    <link rel="stylesheet" href="1-struktur-float.css">
</head>
<body>
    <div class="container">
        <header class="float-l">
            <h1>HEADER</h1>
        </header>
    
        <aside class="float-l">
            <h1>ASIDE</h1>
        </aside>
    
        <main class="float-r">
            <h1>MAIN</h1>
        </main>
        
        <nav class="float-l">
            <h1>NAV</h1>
        </nav>
    
        <footer class="float-l">
            <h1>FOOTER</h1>
        </footer>

        <div class="clear"></div>
    </div>
</body>
</html>
