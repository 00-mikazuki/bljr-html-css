<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Anime</h1>

    <div class="container">
        <ul class="gallery">
            <li>
                <a href="#gbr1">
                    <img src="img/thumbs/goku.png" alt="Goku">
                    <span>Goku</span>
                </a>

                <div class="overlay" id="gbr1">
                    <a href="#" class="close">close</a>

                    <a href="#gbr4" class="prev">prev</a>
                    <img src="img/full/goku.jpg" alt="Goku">
                    <a href="#gbr2" class="next">next</a>
                </div>
            </li>

            <li>
                <a href="#gbr2">
                    <img src="img/thumbs/hxh.png" alt="HXH">
                    <span>HXH</span>
                </a>

                <div class="overlay" id="gbr2">
                    <a href="#" class="close">close</a>

                    <a href="#gbr1" class="prev">prev</a>
                    <img src="img/full/hxh.jpg" alt="HXH">
                    <a href="#gbr3" class="next">next</a>
                </div>
            </li>

            <li>
                <a href="#gbr3">
                    <img src="img/thumbs/obito.png" alt="Obito">
                    <span>Obito</span>
                </a>

                <div class="overlay" id="gbr3">
                    <a href="#" class="close">close</a>

                    <a href="#gbr2" class="prev">prev</a>
                    <img src="img/full/obito.jpg" alt="Obito">
                    <a href="#gbr4" class="next">next</a>
                </div>
            </li>

            <li>
                <a href="#gbr4">
                    <img src="img/thumbs/shinra.png" alt="Shinra">
                    <span>Shinra</span>
                </a>

                <div class="overlay" id="gbr4">
                    <a href="#" class="close">close</a>

                    <a href="#gbr3" class="prev">prev</a>
                    <img src="img/full/shinra.jpg" alt="Shinra">
                    <a href="#gbr1" class="next">next</a>
                </div>
            </li>

            <div class="clear"></div>
        </ul>
    </div>

</body>
</html>
