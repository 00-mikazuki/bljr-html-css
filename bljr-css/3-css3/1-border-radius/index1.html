<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Radius 2</title>
    <style>
        div {
            width: 300px;
            height: 300px;
            background-color: salmon;
            /* jika diberi background-image maka otomatis akan menyesuaikan bentuk divnya */
            border-top-right-radius: 50%;
            border-bottom-left-radius: 50%;
            text-align: center;
            line-height: 300px;
            overflow: hidden;
        }
        div img {
            width: 300px;
        }
    </style>
</head>
<body>
    <div>
        <img src="img/dragon-sin.png" alt="">
    </div>
</body>
</html>
