<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Radius</title>
    <style>
        div {
            width: 300px;
            height: 300px;
            background-color: salmon;
            border-radius: 200px;
            /* semakin besar nilai border radius diberikan, ujung kotak semakin tumpul */
            /* akan menjadi lingkaran jika nilai setengah dari width atau height jika bentuknya persegi (width & height: 300px; border-radius: 150px/50%;)*/
            text-align: center;
            line-height: 300px;
        }
    </style>
</head>
<body>
    <div>Hello World</div>
</body>
</html>
