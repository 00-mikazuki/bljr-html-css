<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Gradient 3</title>
    <style>
        div {
            width: 600px;
            height: 300px;
            margin: 50px auto;
            /* menggunakan arah (to bottom, top, left, right)
            (to left top, left bottom, right top, right bottom) */
            background-image: linear-gradient(to bottom, red, green);
            /* memberikan warna gradasi pada elemen */
            /* linear-gradient (memberikan gradasi warna pada garis lurus) */
            /* radial-gradient (memberikan gradasi warna secara melingkar) */
            /* 
            syntax lengkap 
            background-: linear-gradient(<sudut(degree)>|<arah>, warna awal, warna akhir);
            */
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
