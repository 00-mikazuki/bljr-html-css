<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Gradient 2</title>
    <style>
        div {
            width: 600px;
            height: 300px;
            margin: 50px auto;
            /* menggunakan sudut (degree) */
            background-image: linear-gradient(90deg, red, green);
            /* memberikan warna gradasi pada elemen */
            /* linear-gradient (memberikan gradasi warna pada garis lurus) */
            /* 
            syntax lengkap 
            background-: linear-gradient(<sudut>(degree)|<arah>, warna-1, ..., warna-n);
            */
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
