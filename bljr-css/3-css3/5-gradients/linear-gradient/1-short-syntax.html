<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Gradient</title>
    <style>
        div {
            width: 600px;
            height: 300px;
            margin: 50px auto;
            background-image: linear-gradient(red, white, rgb(255,255,0), green);
            /* memberikan warna gradasi pada elemen */
            /* linear-gradient (memberikan gradasi warna pada garis lurus) */
            /* 
            syntax sederhana 
            background-image: linear-gradient(warna awal, warna akhir);
            background: linear-gradient(warna awal, warna akhir);
            */
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
