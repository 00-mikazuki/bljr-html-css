<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hsla</title>
    <style>
        body {
            background-image: url(img/trees.png);
        }
        .satu {
            width: 300px;
            height: 300px;
            background-color: hsla(24, 100%, 68%, 0.5);
            /* hsla (hue (roda warna) saturation (saturasi) lightness (kecerahan) alpha (transparansi)) */
            position: relative;
        }
        .dua {
            width: 100px;
            height: 100px;
            background-color: purple;
            position: absolute;
            right: -50px;
            bottom: -50px;
        }
    </style>
</head>
<body>
    <div class="satu">
        <div class="dua"></div>
    </div>
</body>
</html>
