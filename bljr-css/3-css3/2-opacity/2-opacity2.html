<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opacity 2</title>
    <style>
        body {
            background-image: url(img/trees.png);
        }
        .satu {
            width: 300px;
            height: 300px;
            background-color: #f60;
            position: relative;
            opacity: 0.5;
        }
        .dua {
            width: 100px;
            height: 100px;
            background-color: purple;
            position: absolute;
            right: -50px;
            bottom: -50px;
            opacity: 1;
            /* tdk bisa membuat elemen child solid ketika elemen parent transparan */
        }
    </style>
</head>
<body>
    <div class="satu">
        <div class="dua"></div>
    </div>
</body>
</html>
