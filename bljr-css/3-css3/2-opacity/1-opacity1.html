<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opacity</title>
    <style>
        body {
            background-image: url(img/trees.png);
        }
        .satu {
            width: 300px;
            height: 300px;
            background-color: #f60;
            opacity: 0.5;
            /* opacity: 0-1; */
            /* 0.5 = .5; 0.25 = .25 */
            position: relative;
        }
        .dua {
            width: 100px;
            height: 100px;
            background-color: purple;
            position: absolute;
            right: -50px;
            bottom: -50px;
            opacity: 0.5;
            /* opacity di dlm opacity (setengah lagi dari opacity parentnya 0.5 x 0.5 = 0.25 */
        }
    </style>
</head>
<body>
    <div class="satu">
        <div class="dua"></div>
    </div>
</body>
</html>
