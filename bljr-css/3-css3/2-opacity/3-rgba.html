<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rgba</title>
    <style>
        body {
            background-image: url(img/trees.png);
        }
        .satu {
            width: 300px;
            height: 300px;
            background-color: rgba(255, 102, 0, 1);
            /* rgba(red, green, blue, alpha (transparansi)) */
            /* rgba memberi transparansi pada warna, opacity memberi transparansi pada elemen */
            /* utk membuat elemen parent transparan dan elemen child tidak */
            position: relative;
        }
        .dua {
            width: 100px;
            height: 100px;
            background-color: purple;
            position: absolute;
            right: -50px;
            bottom: -50px;
            background-color: rgba(255, 102, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="satu">
        <div class="dua"></div>
    </div>
</body>
</html>
