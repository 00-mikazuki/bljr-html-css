<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition 1</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        .container {
            width: 900px;
            margin: 10px auto;
            border: 5px solid black;
        }
        .kotak {
            width: 100px;
            height: 100px;
            background-color: salmon;
            text-align: center;
            line-height: 100px;
            margin: 5px 0;
        }
        /* transition */
        /*
        transition-property: [property-name]
        transition-duration: n s | ms
        transition-delay: n s | ms
        transition-timing-function: ease | ease-in | ease-out | ease-in-out | linear | cubic-bezier()
        */

        /* shorthand */
        /* transition: [property] <durasi> [fungsi] [delay] */
        /* transition: optional wajib optional optional */
        /* default transition: all 1s = transition: 1s */
        /* default property = all, custom = margin, dll */
        /* default fungsi = ease */
        .kotak1 {transition: all 3s ease}
        .kotak2 {transition: all 3s ease-in}
        .kotak3 {transition: all 3s ease-out}
        .kotak4 {transition: all 3s ease-in-out}
        .kotak5 {transition: all 3s linear}
        .kotak6 {transition: all 3s cubic-bezier(0.79,-0.08, 0,-0.43)}
        .container:hover .kotak{
            transform: rotate(720deg);
            margin-left: 800px;
            background-color: royalblue;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="kotak kotak1">ease</div>
        <div class="kotak kotak2">ease-in</div>
        <div class="kotak kotak3">ease-out</div>
        <div class="kotak kotak4">ease-in-out</div>
        <div class="kotak kotak5">linear</div>
        <div class="kotak kotak6">cubic-bezier</div>
    </div>
</body>
</html>
