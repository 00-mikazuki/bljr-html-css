<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3 Transform: scale</title>
    <style>
        p {
            font-size: 20px;
            text-align: center;
        }
        /* 
        Transform
            scale(angka), scaleX(angka), scaleY(angka)
            rotate(deg), rotateX(deg), rotateY(deg)
            skew(deg), skewX(deg), skewY(deg)
            translate(px), translateX(px), translateY(px)
        dapat menggunakan lebih dari 1
        */
        .kotak {
            width: 200px;
            height: 200px;
            background-color: lightblue;
            margin: 50px auto 0;
            transition: 1s;
        }
        .kotak:hover {
            transform: scale(2, 3);
            /* transform: scale(n) */
            /* perbesar ukuran sumbu x dan y sebesar n kali lipat */

            /* transform: scale(nx, ny) */
            /* perbesar ukuran sumbu x sebesar nx kali lipat dan perbesar ukuran sumbu y sebesar ny kali lipat*/

            /* transform: scaleX(n) */
            /* perbesar ukuran sumbu x sebesar n kali lipat */

            /* transform: scaleY(n) */
            /* perbesar ukuran sumbu y sebesar n kali lipat */
        }
    </style>
</head>
<body>
    
    <div class="kotak"></div>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Eaque, dolor! Quibusdam maxime reiciendis, nisi voluptatibus autem qui facilis quisquam odio impedit corrupti laborum tempora sunt labore vitae illo? Veniam, nemo.</p>
</body>
</html>
