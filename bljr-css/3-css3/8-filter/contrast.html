<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3 Filter: contrast</title>
    <style>
        body {
            text-align: center;
        }
        img {
            width: 900px;
            filter: contrast(50%);
            /* filter: contrast(0.5); */
        }
        /* 
        Filter
            blur(px)
            brightness(angka | %)
            contrast(angka | %)
            saturate(angka | %)
            grayscale(angka | %)
            sepia(angka | %)
            hue-rotate(deg)
            invert(angka | %)
            opacity(angka | %)
            drop-shadow(seperti box-shadow)
        */
    </style>
</head>
<body>
    <img src="yuuji.jpg" alt="Itadori Yuuji">
</body>
</html>
