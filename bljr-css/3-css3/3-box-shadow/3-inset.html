<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Shadow 3</title>
    <style>
        div {
            width: 300px;
            height: 300px;
            background-color: lightgreen;
            margin: 50px auto;
            box-shadow: inset 0 0 15px 5px rgba(0, 0, 0, .5);
            /* box-shadow (value wajib): <x-offset> (jarak bayangan thd elemen pd sumbu horizontal) <y-offset> (jarak bayangan thd elemen pd sumbu vertikal) <blur> (berapa besar blur) <color> */
            /* box-shadow (value optional): <inset> (bayangan pindah ke dalam elemen) <x-offset> <y-offset> <blur> <spread> (ukuran sebaran bayangan) <color> */
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
