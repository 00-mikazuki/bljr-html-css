<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Shadow 4</title>
    <style>
        div {
            width: 300px;
            height: 300px;
            background-color: lightgreen;
            margin: 50px auto;
            box-shadow:
                0 0 0 5px red, 
                0 0 0 10px blue,
                0 0 0 15px yellow,
                0 0 0 20px orange;
                /* multiple border dari multiple shadow, shadow 0 blur */
            /* multiple shadow (memberikan lebih dari 1 bayangan pd sebuah elemen) */
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
