<!DOCTYPE html>
<head>
    <title>HTML paragraf</title>
</head>
<body>
    
    <!-- tag <p> (paragraf), <br> (menambahkan baris baru), dan <hr> (membuat garis horizontal) -->
    <p>ini adalah paragraf 1</p>
    <br> 
    <p>ini adalah <br> paragraf 2</p>
    <hr>

    <!-- tag dekorasi <b> (bold), <i> (italic), <u> (underline) -->
    <p><b>selamat datang</b> di kuliah <i>pemrograman web 1</i></p>
    <p>nama saya <u>dio</u></p>
    <hr>

    <!-- tag penekanan <em> (emphasize/penekanan: memberikan penekanan pada sebuah teks), <strong> (penekanan yang lebih kuat lagi) -->
    <p><strong>Pengumuman</strong>. kuliah pemrograman web 1 <em>ditiadakan</em></p>

</body>
</html>
