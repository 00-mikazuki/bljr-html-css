<!DOCTYPE html>
<html>
<head>
    <title>HTML Form</title>
</head>
<body>
    
    <!-- tag <input> (user dapat menginputkan sesuatu), <textarea> (mirip spt textfill tp lebih banyak yg dpt diisikan), 
        <select> (membuat dropdown, combobox), <button> (tombol untuk melakukan hal spesifik), <label> (menandai elemen input) -->
    <form action="">
        <!-- <input type=""> text, password, radio, checkbox, {submit, reset, button} tidak disarankan menggunakan input (menggunakan tag <button>) -->
        <!-- type = text -->
        <label for="username">username :</label>
        <input type="text" id="username">
        <br>

        <!-- type = password -->
        <label for="password">password :</label>
        <input type="password" id="password">
        <br><br>

        <!-- type = radio -->
        <input type="radio" id="baru"><label for="baru">pengguna baru</label>
        <br>
        <input type="radio" id="ingat"><label for="ingat">ingat password saya?</label>
        <br><br>

            <!-- name (untuk menamakan radiobutton agar menandakan bahwa radiobutton berada pada grup yg sama) -->
        <input type="radio" id="pria" name="jeniskelamin"><label for="pria">pria</label>
        <input type="radio" id="wanita" name="jeniskelamin"><label for="wanita">wanita</label>
        <br><br>

        <!-- type = ceckbox (untuk memilih lebih dari 1) -->
        <input type="checkbox" id="olahraga"><label for="olahraga">olahraga</label>
        <input type="checkbox" id="musik"><label for="musik">musik</label>
        <input type="checkbox" id="ngoding"><label for="ngoding">ngoding</label>
        <br><br>

        <!-- type = submit (mengirim data). value (mengganti tulisan)-->
        <input type="submit" value="kirim">

        <!-- type = reset (menghapus semua data) -->
        <input type="reset">

        <!-- type = button (memberi fungsi spesifik) -->

        <br><br>

        <!-- text area -->
        <textarea name="" id="" cols="30" rows="10"></textarea>
        <br><br>

        <!-- dropdown <select> -->
        <select name="" id="">
            <option value="">Blitar</option>
            <option value="">Kediri</option>
            <option value="">TA</option>
        </select>
        <br><br>

        <!-- <button type=""> submit, reset, button -->
        <button type="submit">kirim</button>
        <br><br>
    </form>

</body>
</html>
