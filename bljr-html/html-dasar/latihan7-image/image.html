<!DOCTYPE html>
<html>
<head>
    <title>Image</title>
</head>
<body>
    
    <!-- tag <img> (image/menambahkan gambar) -->
    <!-- src (source), alt (alternative, jika source gambar terdapat masalah), title (judul gambar), width (lebar), height (tinggi) -->
    <!-- ukuran width dan height dapat menggunakan px (pixel: 100, 150 / angka saja) atau % (relative terhadap halaman: 50%, 70%). Jika menggunakan salah satu (width saja atau height saja) maka ukuran yang lainnya akan menyesuaikan ukuran gambar, jika menggunakan keduanya gambarnya bisa stretch -->

    <!-- internal resource -->
    <img src="shika.jpg" alt="naruto shikamaru" width="100%">

    <!-- external resource (hotlink) -->
    <img src="https://e7.pngegg.com/pngimages/721/424/png-clipart-crayon-shin-chan-shinnosuke-nohara-cartoon-humour-shin-juk-gu-television-food.png" title="shinchan" width="500" height="1000">

</body>
</html>
