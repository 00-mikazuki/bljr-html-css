<!DOCTYPE html>
<html>
<head>
    <title>Hyperlink - Halaman 1</title>
</head>
<body>

    <!-- tag <a> (anchor: jangkar/sumber) -->
    <!-- <a href="link"></a> -->
    <!-- href external link -->
    <p>Klik <a href="http://www.google.com">disini</a> untuk informasi lebih lanjut.</p>

    <!-- href internal link -->
    <p>Klik <a href="halaman0.html">disini</a> untuk pergi ke halaman 0.</p>

    <!-- href relative url -->
    <p>Klik <a href="../admin/halaman2.html">disini</a> untuk pergi ke halaman 2.</p>

    <!-- page anchor -->
    <a href="halaman3.html#bagian3">Ke Halaman 3, Bagian 3</a>

    <br>

    <!-- target default: _self (same tab). custom: _blank (new tab), _parent, _top -->
    <a href="halaman3.html" target="_blank">Ke Halaman 3, new tab</a>

</body>
</html>
