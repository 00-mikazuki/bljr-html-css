<!DOCTYPE html>
<html>
<head>
    <title>Form</title>
</head>
<body>
    <table border="1" cellspacing="0" cellpadding="5">
        <form>
            <tr>
                <td><label for="text">Text :</label></td>
                <td><input type="text" id="text"></td>
            </tr>
            <tr>
                <td><label for="password">password :</label></td>
                <td><input type="password" id="password"></td>
            </tr>
            <tr>
                <td colspan="2">
                    <label for="1">Radio 1</label><input type="radio" id="1" name="rad">
                    <label for="2">Radio 2</label><input type="radio" id="2" name="rad">
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <label for="1">checkbox 1</label><input type="checkbox" id="1">
                    <label for="2">checkbox 2</label><input type="checkbox" id="2">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="combo">Combo Box :</label>
                </td>
                <td>
                    <select id="combo">
                        <option>Option 1</option>
                        <option>Option 2</option>
                        <option>Option 3</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="textarea">Textarea :</label>
                </td>
                <td>
                    <textarea></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <button type="button">Button</button>
                </td>
            </tr>

        </form>
    </table>
</body>
</html>
